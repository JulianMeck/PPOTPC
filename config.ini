[Sample]
# Sample length in mm. Used when thickness_mode = fixed.
l = 12.68
# Error on sample length in m, not mm.
l_err = 0.01e-3

# Sample thickness mode:
#   fixed  -> use l above for every calculation
#   mean   -> use a thickness column/variable from the data file
#             sin: mean over selected ROI
#             cont: mean in each moving window
thickness_mode = fixed

# Optional validity range for thickness_mode = mean, after applying thickness_scale.
# Values must satisfy thickness_min_mm < thickness <= thickness_max_mm.
# These can also be placed in [File].
# thickness_min_mm = 0
# thickness_max_mm = 5

# Sample diameter in mm.
dia = 18.83
# Error on sample diameter in mm.
dia_err = 0.01

[Storage]
# Downstream storage mode:
#   Dv -> provide downstream volume; bd = Dv x fluid compressibility is calculated per measurement
#   bd -> provide directly measured downstream storage capacity
mode = Dv

# Required when mode = Dv: downstream volume in m^3 and its uncertainty.
Dv = 9.6085e-6
Dv_err = 0.01e-6

# Required when mode = bd: downstream storage capacity in m^3/Pa and its uncertainty.
# Uncomment these and set mode = bd to use direct downstream storage.
# bd = 2.2522378352e-15
# bd_err = 5e-17

[Experiment]
# Temperature in K.
Temp = 293
# Permeant fluid: water, argon, or rheolube.
permeant = water

[File]
# Data file type:
#   dat -> tab-delimited text file, use column indices below
#   mat -> MATLAB .mat file, use variable names below
mode = dat

# --- dat mode inputs ---
# Number of header rows to skip.
HeaderRows = 3
# Column indices are 0-based.
time_col = 0
Pup_col = 1
Pdwn_col = 2
Pc_col = 3

# If thickness_mode = mean and mode = dat, uncomment and set the thickness column.
# thickness_col = 4

# --- mat mode inputs ---
# Required when mode = mat. Names must match variables inside the .mat file.
# time_var = Time
# Pup_var = PumpPressure
# Pdwn_var = Pf
# Pc_var = Normal

# Optional scale factors for mat mode. Raw value x scale = value used by script.
# For SHIVA files, Time is commonly stored in ms, so time_scale = 0.001 converts to seconds.
# time_scale = 0.001
# Pup_scale = 1
# Pdwn_scale = 1
# Pc_scale = 1

# If thickness_mode = mean and mode = mat, uncomment and set the thickness variable.
# thickness_var = Thickness

# Optional thickness scale for thickness_mode = mean, in dat or mat mode.
# Raw thickness value x thickness_scale = thickness in mm.
# thickness_scale = 1

[Processing]
# Processing type:
#   sin  -> one selected oscillation interval, one output row
#   cont -> continuous moving-window processing within the selected ROI
proc_type = sin

# Required/recommended when proc_type = cont.
# Number of wave periods in each time-based moving window.
# The window advances by one fitted period.
# periods_2_proc = 5

[Fitting]
# Number of bootstrap resamples.
N = 20

# Bernabé fit weighting:
#   w = 0   -> amplitude ratio only
#   w = 1   -> phase only
#   w = 0.5 -> equal weight of amplitude and phase
w = 0.5

# Minimum and maximum oscillation period searched by sine fitting, in seconds.
Tmin = 10
Tmax = 10000

# Print Bernabé xi boundary/floor diagnostics during main fits.
# Shows A, phi, phi_xi0, margin, starting eta/xi, branch, and xi floor status.
xi_debug = false

# Show measured data and best-fit curves for continuous moving windows in Figure 8.
# Only applies to proc_type = cont.
debug_bestfit = false

# When debug_bestfit = true, plot/save every N accepted continuous windows.
debug_bestfit_every = 1

# Seconds to pause after each debug plot. Use a finite value to avoid Tk blocking.
# Closing Figure 8 disables debug_bestfit and lets processing continue.
debug_bestfit_pause = 0.05
